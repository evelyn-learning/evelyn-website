# Nginx configuration for Evelyn Learning website
# Place this file in /etc/nginx/sites-available/evelyn.conf
# Then symlink to sites-enabled: ln -s /etc/nginx/sites-available/evelyn.conf /etc/nginx/sites-enabled/

# Marketing app (@evelyn/marketing). Keeps port 3001 — the port the single
# pre-split `evelyn-website` process used — so every non-tutor location in
# this file needed no change when the app was split in two (M1a).
upstream evelyn_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Tutor app (@evelyn/tutor), the process that serves /tutor, /tutor-portal,
# /api/tutor*, /api/portal/v1/** and the three relocated /admin tools.
upstream evelyn_tutor_upstream {
    server 127.0.0.1:3007;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name evelynlearning.com www.evelynlearning.com;
    return 301 https://www.evelynlearning.com$request_uri;
}

# Redirect non-www to www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evelynlearning.com;

    ssl_certificate /etc/letsencrypt/live/evelynlearning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evelynlearning.com/privkey.pem;

    return 301 https://www.evelynlearning.com$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.evelynlearning.com;

    # Session-audio chunks: a 30s PCM16 flush is ~1.4MB; the nginx default
    # (1m) would 413 it if no wider limit is set at the http{} level on the
    # box. Pin it explicitly here so the repo conf is self-sufficient —
    # a rejected chunk used to silently desync the whole recording
    # (round-29 replay-desync audit; client now rolls back on !ok).
    client_max_body_size 16m;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/evelynlearning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evelynlearning.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/evelyn.access.log;
    error_log /var/log/nginx/evelyn.error.log;

    # Root and index
    root /var/www/evelyn-website/public;

    # Static files caching
    #
    # TWO Next processes, ONE origin, ONE asset prefix. Since the M1a split,
    # marketing (:3001) and the tutor (:3007) each serve their own build
    # output under the SAME /_next/static/ prefix on this single hostname, so
    # no path rule can tell them apart. This block used to be a filesystem
    # alias (`alias /var/www/evelyn-website/.next/static/;`), which can only
    # ever serve ONE app's chunks — left that way, every tutor page would load
    # zero JavaScript in production.
    #
    # So: ask marketing first, and fall back to the tutor on a 404. The
    # fallback is safe precisely because Next static asset filenames are
    # CONTENT-HASHED: a name present in one app's build never means something
    # different in the other's, so the fallback can only ever find the right
    # file or nothing at all. The cost is one extra internal 404 round-trip
    # per tutor asset — all of them immutable and cached for a year.
    #
    # THE ERROR LIST IS 404 *AND* 502/503/504, AND THAT IS LOAD-BEARING.
    # 404 is the "this chunk belongs to the other app" case. 502/503/504 is
    # the "marketing is not listening" case — and marketing is not listening
    # for MINUTES on every deploy of it, between `pm2 delete` and the new
    # process binding :3001. With 404 alone, that window takes the TUTOR down
    # with it: every /_next/static/ request, including every chunk of
    # /tutor-portal/embed loading inside a live Crimsora student iframe,
    # would get a connection refused, nginx would synthesise a 502, and the
    # fallback would never fire. Zero tutor downtime is the whole point of
    # running two processes, and this dependency exists ONLY because this
    # block routes tutor assets through marketing — so this block has to
    # undo it. nginx-generated 502/503/504 go through error_page regardless
    # of proxy_intercept_errors, which only governs upstream-sent statuses.
    #
    # The reverse exposure is deliberately accepted: while the TUTOR is
    # restarting, a marketing asset that 404s here (i.e. one that legitimately
    # belongs to the tutor) yields the tutor's connection error instead of a
    # 404. That trade is fine — marketing pages never load tutor chunks, so
    # the case is nearly empty, and a marketing asset is not a live session.
    #
    # SEEN AND PRICED, not missed: adding 502 to the list changes what a
    # client observes during marketing's own restart from a 502 to a 404 (the
    # request now reaches the tutor, which legitimately does not have that
    # marketing chunk). Cloudflare does not cache 5xx but DOES negative-cache
    # 404s — roughly 3 minutes by default — and .js/.css are in its default
    # cached set, so a user sitting on a marketing page during a deploy can
    # keep failing for a few minutes after the process is back. Accepted: the
    # URLs affected are OLD-build content-hashed chunks, the post-deploy HTML
    # references new hashes, so anyone who reloads gets a clean page — and
    # without this line they would have been failing on a 502 anyway.
    #
    # Do NOT "simplify" this back into a single alias. Do NOT solve it with
    # assetPrefix in next.config.ts (changes the apps' build behaviour), and
    # do NOT solve it by merging the two .next/static trees at deploy time
    # (couples the two deploys to each other).
    location /_next/static/ {
        proxy_pass http://evelyn_upstream;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @tutor_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback half of the /_next/static/ pair above. Named location, so it is
    # only ever reachable via that block's error_page — never matched directly.
    location @tutor_static {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Partner-embeddable tutor session — loaded cross-origin inside partner
    # iframes (tutor-portal/embed/page.tsx: "This page lives inside partner
    # iframes"). The site-wide X-Frame-Options: SAMEORIGIN above would block
    # that, so this location overrides it with a CSP frame-ancestors
    # allowlist instead. add_header does NOT inherit from the server block
    # once redeclared here, so the other security headers are repeated
    # (minus X-Frame-Options, which CSP frame-ancestors supersedes).
    # Add each new white-label partner's origin(s) to this list.
    # Student session replay — same partner-iframe carve-out as the embed
    # (crimsora iframes it from the student dashboard; token-gated page).
    location = /tutor-portal/replay {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crimsora.com https://www.crimsora.com" always;

        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location = /tutor-portal/embed {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crimsora.com https://www.crimsora.com" always;

        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Phase-2 doc ingestion: POST /api/portal/v1/plan-generate can legally
    # receive up to 4 materials, each up to the contract's 11,000,000-char
    # base64 `data` field (PlanMaterialSchema, portal-contract v1.10.0) — 4 x
    # 11M = 44M chars of base64 body alone, plus JSON structure/escaping and
    # the other request fields (topicHint, courseKey, name/mimeType per
    # file), landing around ~44.5MB. The server block's global 16m (set for
    # session-audio PCM chunks, see that directive's own comment) would 413
    # a legitimate 4-file upload well before it reaches this route's own
    # extractMaterials size checks. 46m leaves comfortable headroom above
    # the ~44.5MB ceiling while keeping every OTHER route on the tighter
    # 16m default. NOTE: this is the repo-tracked conf — the LIVE server's
    # /etc/nginx/sites-available/evelyn.conf needs this same location block
    # applied and `nginx -s reload` at ship time; editing this file alone
    # does not change production.
    #
    # M1a: all 23 /api/portal/v1/** partner routes moved into the tutor app,
    # so this whole prefix now targets evelyn_tutor_upstream. Crimsora's
    # frozen contract depends on it — if this block ever drifts back to
    # evelyn_upstream, every partner integration 404s.
    location /api/portal/v1/ {
        client_max_body_size 46m;

        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Tutor app surfaces (M1a split) — everything below routes to
    # evelyn_tutor_upstream (:3007). Everything NOT listed here falls
    # through to `location /` and is served by marketing (:3001).
    #
    # Each block carries the same directive set as `location /`, including
    # the Upgrade/Connection pair: the tutor's voice paths negotiate
    # WebSockets and a proxy without those headers silently downgrades them.
    #
    # PAIRS OF EXACT + PREFIX. `location /tutor/` does NOT match `/tutor`,
    # and `/tutor` is the main demo page. Every tutor surface reachable
    # without a trailing slash therefore gets an exact (`=`) block next to
    # its prefix block. nginx tries exact matches first, then the longest
    # prefix, so the two `location = /tutor-portal/{embed,replay}` blocks
    # above still win over `location /tutor-portal/` here and keep their
    # per-route CSP frame-ancestors headers. Do NOT convert those two to
    # prefix blocks and do NOT delete their headers.
    # ------------------------------------------------------------------

    location = /tutor {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /tutor/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location = /tutor-portal {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /tutor-portal/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /api/tutor/ {
        # /api/tutor/session-audio posts PCM16 chunks; the server block's
        # global 16m is what that limit was originally raised for. Keep it.
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Serves /api/tutor-portal/demo-token, which the MARKETING product page's
    # VoiceTutorLiveDemo calls before it iframes /tutor-portal/embed. A
    # cross-process call that no build or test can catch — without this block
    # the live demo on evelynlearning.com 404s.
    location /api/tutor-portal/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Three internal /admin tools moved into the tutor app with the code they
    # operate on (M1a Task 6): /admin/demos, /admin/video-curator and
    # /admin/tutor-sessions, plus their /api/admin/** routes. EVERY other
    # /admin/** and /api/admin/** path stays on marketing and must keep
    # falling through to `location /` — in particular /api/auth/**, which the
    # NextAuth session these pages read still lives on marketing.
    #
    # These pages gate themselves (getServerSession server-side, useSession
    # client-side), exactly as they did before the split; the /admin tree has
    # never had a middleware gate on either side of this refactor.
    location = /admin/demos {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /admin/demos/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location = /admin/video-curator {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /admin/video-curator/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location = /admin/tutor-sessions {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Covers /admin/tutor-sessions/<sessionId>.
    location /admin/tutor-sessions/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # /api/admin/demos is a real route on its own AND has a /sessions child,
    # so it needs the exact block as well as the prefix one.
    location = /api/admin/demos {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /api/admin/demos/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # /api/admin/video-curator has no route of its own — only children
    # (validate-video, segment-video, drafts, save, topics) — so the prefix
    # block alone is correct here; a bare /api/admin/video-curator 404s from
    # marketing exactly as it 404'd before the split.
    location /api/admin/video-curator/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # The Ketcher molecule editor: a PLAIN STATIC ASSET TREE that lives only in
    # the tutor's public/ (apps/tutor/public/ketcher/). It is not under /tutor,
    # so nothing else in this section catches it, and without this block it
    # falls through to `location /` → marketing, which has no ketcher/ at all.
    # The failure is silent and total: WhiteboardCanvas renders MoleculeRenderer,
    # which iframes /ketcher/index.html, which pulls /ketcher/bundle.css and
    # /ketcher/bundle.js; all three 404, the editor never posts `ketcher-ready`,
    # and a chemistry session shows a whiteboard stuck on "Loading chemistry
    # editor...". No build, typecheck or test sees any of it.
    #
    # HOW TO FIND THE NEXT ONE OF THESE — do not spot-check, run the inventory:
    #   comm -23 <(cd apps/tutor/public && find . -type f | LC_ALL=C sort) \
    #            <(cd apps/marketing/public && find . -type f | LC_ALL=C sort)
    # Anything it prints is served by the tutor process alone and needs a rule
    # here. Today it prints exactly one line, ./ketcher/index.html (bundle.js
    # and bundle.css are build-generated and gitignored, so they are absent from
    # a fresh checkout — they ship because the zip takes public/ off the local
    # filesystem, not out of git). The reason a spot-check misses this: every
    # OTHER file in the tutor's public/ — favicon.ico, favicon.png,
    # images/site/logo-icon.png — also exists in marketing's, so eyeballing the
    # two directories suggests nothing is tutor-exclusive.
    #
    # Prefix block only: every reference is to a file under /ketcher/, and a
    # bare /ketcher is not a route in either app.
    location /ketcher/ {
        proxy_pass http://evelyn_tutor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Proxy to Next.js
    #
    # Marketing (:3001) is the DEFAULT. Everything the blocks above do not
    # claim lands here — including /api/demos/session and /api/demos/track
    # (called by the tutor's own /tutor page through @evelyn/core's
    # useDemoTracking) and /api/auth/** (NextAuth's only route lives in
    # marketing, and the tutor's /admin pages depend on reaching it here).
    # Do not add an /api/auth/ block pointing at the tutor.
    location / {
        proxy_pass http://evelyn_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Old WordPress URL redirects (handled by Next.js, but as backup)
    location /contact-us {
        return 301 /contact;
    }

    location /short-interviews {
        return 301 /interviews;
    }

    location /speakers-hall-of-fame {
        return 301 /speakers;
    }

    location /webinar {
        return 301 /webinars;
    }
}
