# Mirror of the LIVE production config. Real path on the server:
# /etc/nginx/sites-enabled/keystone.evelynlearning.com (a symlink to ../sites-available/keystone.evelynlearning.com).
# Captured 2026-11-24. Keep it in sync by hand whenever the live file changes; nothing applies it automatically.
# (scripts/ops/marketing-bluegreen/apply-nginx.sh changes the live file once; refresh this copy after running it.)
#
# keystone.evelynlearning.com — Keystone, Castle Rock review site (marketing app pm2 evelyn-marketing, :3001, routes under /keystone via src/proxy.ts).
# Webroot certbot, DNS-only record (grey cloud). Applied by hand 2026-11-16; deploy scripts do not touch this file.
server {
    listen 80;
    server_name keystone.evelynlearning.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://keystone.evelynlearning.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name keystone.evelynlearning.com;
    ssl_certificate /etc/letsencrypt/live/keystone.evelynlearning.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keystone.evelynlearning.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/keystone.access.log;
    # QTI zips of many items (route caps at 200 MB).
    client_max_body_size 200M;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;  # the animated player opens in a same-origin iframe
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_request_buffering off;
    }
}
