# Mirror of the LIVE production config, captured after the M1a cutover
# (2026-08-15). Real path on the server: /etc/nginx/sites-available/tutor-evelynlearning
# This is the file that is actually served. Keep it in sync by hand whenever
# the live file changes; nothing applies it automatically.
#
server {
    server_name tutor.evelynlearning.com;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    client_max_body_size 50M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tutor.evelynlearning.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tutor.evelynlearning.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tutor.evelynlearning.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name tutor.evelynlearning.com;

    listen 80;
    return 404; # managed by Certbot


}