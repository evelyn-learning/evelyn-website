[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evelyn-tutor"
version = "0.1.0"
description = "Add the Evelyn Voice Tutor to your app: signed session links and the worksheet and usage API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Evelyn Learning", email = "info@evelynlearning.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["evelyn", "tutor", "ai-tutor", "voice", "education", "embed"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://tutor.evelynlearning.com/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evelyn_tutor = ["py.typed"]
