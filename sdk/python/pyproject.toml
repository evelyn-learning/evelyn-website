[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evelyn-tutor"
version = "0.1.0"
description = "Add the Evelyn Voice Tutor to your app: signed session links, the worksheet and usage API, and webhook verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evelyn Learning", email = "info@evelynlearning.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["evelyn", "tutor", "ai-tutor", "voice", "education", "embed"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://tutor.evelynlearning.com/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evelyn_tutor = ["py.typed"]
