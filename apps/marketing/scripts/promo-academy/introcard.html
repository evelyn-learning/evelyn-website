<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px;
    background: radial-gradient(1200px 800px at 50% 38%, #4f46e5 0%, #4338ca 45%, #3730a3 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }
  .logo {
    width: 148px; height: 148px; border-radius: 33px; background: rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 800; box-shadow: 0 18px 60px rgba(0,0,0,.35);
  }
  .word { font-size: 92px; font-weight: 800; letter-spacing: -1.5px; }
  .tag  { font-size: 40px; font-weight: 500; color: #e0e7ff; }
  .cta  {
    margin-top: 26px; padding: 26px 64px; border-radius: 999px;
    background: #fff; color: #4338ca; font-size: 42px; font-weight: 700;
    box-shadow: 0 12px 44px rgba(0,0,0,.35);
  }
  .domain { font-size: 34px; color: #c7d2fe; }
</style>
</head>
<body>
  <div class="logo">EA</div>
  <div class="word">Evelyn Academy</div>
  <div class="tag">Your branded AI learning platform.</div>

</body>
</html>
